<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>ProPOS • NextGen Cashier</title>

  <style>
    :root {
      --bg: #0b0f17;
      --panel: #161b26;
      --panel-border: #232d3f;
      --surface: #1e2536;
      --surface-hover: #2a344b;
      
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --warning: #f59e0b;

      --text: #f1f5f9;
      --text-muted: #94a3b8;
      
      --radius: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* LAYOUT OUTLINE */
    .app-viewport { display: flex; height: 100dvh; width: 100vw; overflow: hidden; }

    /* LEFT SIDEBAR: LIVE TICKET */
    .ticket-deck {
      width: 380px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .ticket-header {
      padding: 16px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-selector-btn {
      background: var(--surface);
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: var(--radius);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticket-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket-item {
      background: var(--surface);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .ticket-footer {
      padding: 16px;
      border-top: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.2);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .total-amount { font-size: 28px; font-weight: 900; color: var(--success); }

    .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay-btn {
      height: 48px;
      border: none;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .pay-btn:active { transform: scale(0.96); }
    .pay-cash { background: var(--success); color: #000; box-shadow: 0 0 12px var(--success-glow); }
    .pay-card { background: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }

    /* RIGHT SIDEBAR: GRID WORKSPACE */
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .top-nav {
      height: 60px;
      padding: 0 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
    }
    .cat-btn {
      padding: 10px 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-auto-rows: 100px;
      gap: 12px;
    }

    .prod-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    .prod-card:active { background: var(--surface-hover); border-color: var(--accent); }
    .prod-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .prod-price { font-size: 13px; font-weight: 800; color: var(--text-muted); }

    /* MODAL TABLES OVERLAY */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; z-index: 100;
      backdrop-filter: blur(5px);
    }
    .modal-tables {
      width: 90%; max-width: 600px; background: var(--panel);
      border: 1px solid var(--panel-border); border-radius: 16px; padding: 20px;
    }
    .tables-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
    .t-btn {
      height: 70px; background: var(--surface); border: 1px solid var(--panel-border);
      border-radius: var(--radius); color: #fff; font-size: 18px; font-weight: 800;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .t-btn.active-table { border-color: var(--success); background: rgba(16,185,129,0.15); }

    /* RESPONSIVE DESIGN FOR SMALLER SCREENS */
    @media (max-width: 768px) {
      .app-viewport { flex-direction: column; }
      .ticket-deck { width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid var(--panel-border); }
      .main-workspace { height: 55vh; }
    }
  </style>
</head>

<body>

  <div class="app-viewport">
    
    <!-- LEFT PANEL: TICKET & QUICK PAY -->
    <section class="ticket-deck">
      <div class="ticket-header">
        <button class="table-selector-btn" id="tableSelectBtn">
          <span>📍 Τραπέζι: <strong id="currentTableLabel">T1</strong></span>
        </button>
        <button id="btnClear" style="background:none; border:none; color:var(--danger); font-weight:700; cursor:pointer;">Καθαρισμός</button>
      </div>

      <div class="ticket-body" id="ticketItems">
        <!-- Live Items Inserted Here -->
      </div>

      <div class="ticket-footer">
        <div class="total-row">
          <span style="color:var(--text-muted); font-weight:700;">Σύνολο:</span>
          <span class="total-amount" id="totalAmount">0.00 €</span>
        </div>
        <div class="pay-grid">
          <button class="pay-btn pay-cash" onclick="processPayment('cash')">💵 Μετρητά</button>
          <button class="pay-btn pay-card" onclick="processPayment('card')">💳 Κάρτα</button>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: CATALOG & COMMAND -->
    <section class="main-workspace">
      <header class="top-nav">
        <div style="font-weight:900; letter-spacing: -0.5px; font-size: 18px; color:var(--accent);">ProPOS</div>
        <div id="clockDisplay" style="font-size:13px; font-weight:700; color:var(--text-muted);">00:00</div>
      </header>

      <nav class="cat-bar" id="catBar">
        <!-- Categories Inserted Here -->
      </nav>

      <main class="grid-container" id="productGrid">
        <!-- Products Inserted Here -->
      </main>
    </section>

  </div>

  <!-- MODAL TABLE SELECTOR -->
  <div class="overlay" id="tableOverlay">
    <div class="modal-tables">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Επιλογή Τραπεζιού</h3>
        <button onclick="closeTableModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div class="tables-grid" id="tablesGrid">
        <!-- Tables Dynamic -->
      </div>
    </div>
  </div>

  <script>
    // DATA MODEL
    const db = {
      tables: ['T1', 'T2', 'T3', 'T4', 'T5', 'BAR'],
      categories: [
        { id: 'coffee', name: '☕ Καφέδες' },
        { id: 'drinks', name: '🥤 Αναψυκτικά' },
        { id: 'snack',  name: '🥐 Σνακ' }
      ],
      products: [
        { id: 'p1', cat: 'coffee', name: 'Espresso', price: 2.00 },
        { id: 'p2', cat: 'coffee', name: 'Cappuccino', price: 3.00 },
        { id: 'p3', cat: 'coffee', name: 'Freddo Espresso', price: 3.20 },
        { id: 'p4', cat: 'drinks', name: 'Νερό 0.5L', price: 0.50 },
        { id: 'p5', cat: 'drinks', name: 'Coca Cola', price: 2.50 },
        { id: 'p6', cat: 'snack',  name: 'Τυρόπιτα', price: 2.20 },
        { id: 'p7', cat: 'snack',  name: 'Τοστ', price: 2.00 }
      ]
    };

    // STATE
    let activeTable = 'T1';
    let activeCategory = 'coffee';
    let orders = {}; // Structure: { 'T1': [ {id, name, price, qty} ] }

    // INITIALIZATION
    function init() {
      db.tables.forEach(t => orders[t] = []);
      renderCategories();
      renderProducts();
      renderTicket();
      updateClock();
      setInterval(updateClock, 1000);
    }

    // RENDER FUNCTIONS
    function renderCategories() {
      const catBar = document.getElementById('catBar');
      catBar.innerHTML = db.categories.map(c => `
        <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" onclick="setCategory('${c.id}')">
          ${c.name}
        </button>
      `).join('');
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const filtered = db.products.filter(p => p.cat === activeCategory);
      grid.innerHTML = filtered.map(p => `
        <div class="prod-card" onclick="addToTicket('${p.id}')">
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">${p.price.toFixed(2)} €</div>
        </div>
      `).join('');
    }

    function renderTicket() {
      document.getElementById('currentTableLabel').innerText = activeTable;
      const ticketBody = document.getElementById('ticketItems');
      const currentOrder = orders[activeTable] || [];

      if (currentOrder.length === 0) {
        ticketBody.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px;">Το τραπέζι είναι άδειο.</div>`;
        document.getElementById('totalAmount').innerText = '0.00 €';
        return;
      }

      ticketBody.innerHTML = currentOrder.map(item => `
        <div class="ticket-item">
          <div>
            <div style="font-weight:700; font-size:14px;">${item.name}</div>
            <div style="font-size:12px; color:var(--text-muted);">${(item.price * item.qty).toFixed(2)} €</div>
          </div>
          <div class="item-controls">
            <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
            <span style="font-weight:800; font-size:14px;">${item.qty}</span>
            <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      const total = currentOrder.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('totalAmount').innerText = total.toFixed(2) + ' €';
    }

    // ACTIONS
    function setCategory(id) {
      activeCategory = id;
      renderCategories();
      renderProducts();
    }

    function addToTicket(productId) {
      const prod = db.products.find(p => p.id === productId);
      const currentOrder = orders[activeTable];
      const existing = currentOrder.find(i => i.id === productId);

      if (existing) {
        existing.qty++;
      } else {
        currentOrder.push({ ...prod, qty: 1 });
      }
      renderTicket();
    }

    function updateQty(productId, delta) {
      const currentOrder = orders[activeTable];
      const item = currentOrder.find(i => i.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        orders[activeTable] = currentOrder.filter(i => i.id !== productId);
      }
      renderTicket();
    }

    function processPayment(method) {
      const currentOrder = orders[activeTable];
      if (!currentOrder || currentOrder.length === 0) return;

      const total = currentOrder.reduce((sum, i) => sum + (i.price * i.qty), 0);
      alert(`Πληρωμή ${total.toFixed(2)} € με ${method === 'cash' ? 'Μετρητά' : 'Κάρτα'} ολοκληρώθηκε!`);
      orders[activeTable] = [];
      renderTicket();
    }

    // MODAL TABLES HANDLERS
    document.getElementById('tableSelectBtn').onclick = () => {
      const grid = document.getElementById('tablesGrid');
      grid.innerHTML = db.tables.map(t => {
        const hasOrder = orders[t] && orders[t].length > 0;
        return `
          <button class="t-btn ${t === activeTable ? 'active-table' : ''}" onclick="selectTable('${t}')">
            ${t}
            ${hasOrder ? `<span style="font-size:10px; color:var(--success);">• Ενεργό</span>` : ''}
          </button>
        `;
      }).join('');
      document.getElementById('tableOverlay').style.display = 'flex';
    };

    function closeTableModal() {
      document.getElementById('tableOverlay').style.display = 'none';
    }

    function selectTable(t) {
      activeTable = t;
      renderTicket();
      closeTableModal();
    }

    document.getElementById('btnClear').onclick = () => {
      orders[activeTable] = [];
      renderTicket();
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
    }

    // START
    init();
  </script>
</body>
</html>
