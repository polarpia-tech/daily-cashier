<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>ProPOS • Ultimate Command Center</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #0b0f17;
      --panel: #161b26;
      --panel-border: #232d3f;
      --surface: #1e2536;
      --surface-hover: #2a344b;
      
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --warning: #f59e0b;

      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --radius: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* LAYOUT OUTLINE */
    .app-viewport { display: flex; height: 100dvh; width: 100vw; overflow: hidden; }

    /* LEFT SIDEBAR: LIVE TICKET */
    .ticket-deck {
      width: 380px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .ticket-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-selector-btn {
      background: var(--surface);
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: var(--radius);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticket-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket-item {
      background: var(--surface);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .ticket-footer {
      padding: 16px;
      border-top: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.2);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .total-amount { font-size: 28px; font-weight: 900; color: var(--success); }

    .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pay-btn {
      height: 48px;
      border: none;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.05s ease, filter 0.1s;
    }
    .pay-btn:active { transform: scale(0.96); }
    .pay-cash { background: var(--success); color: #000; box-shadow: 0 0 12px var(--success-glow); }
    .pay-card { background: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }

    /* RIGHT SIDEBAR: GRID WORKSPACE */
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .top-nav {
      height: 60px;
      padding: 0 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
    }

    .search-box {
      width: 220px;
      height: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--panel-border);
      background: var(--surface);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 13px;
    }

    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: rgba(0,0,0,0.1);
    }
    .cat-btn {
      padding: 10px 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-auto-rows: 100px;
      gap: 12px;
    }

    .prod-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    .prod-card:active { background: var(--surface-hover); border-color: var(--accent); }
    .prod-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .prod-price { font-size: 13px; font-weight: 800; color: var(--text-muted); }

    /* MODAL OVERLAYS */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal {
      width: 90%; max-width: 520px; background: var(--panel);
      border: 1px solid var(--panel-border); border-radius: 16px; padding: 20px;
      max-height: 85vh; overflow-y: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-head h3 { margin: 0; font-size: 18px; }

    .tables-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
    .t-btn {
      height: 70px; background: var(--surface); border: 1px solid var(--panel-border);
      border-radius: var(--radius); color: #fff; font-size: 18px; font-weight: 800;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .t-btn.active-table { border-color: var(--success); background: rgba(16,185,129,0.15); }

    .input-field {
      width: 100%; height: 42px; background: var(--surface); border: 1px solid var(--panel-border);
      border-radius: var(--radius); color: #fff; padding: 0 12px; margin-top: 8px; outline: none;
    }

    .btn-action {
      height: 42px; padding: 0 16px; border-radius: var(--radius); border: none;
      font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; margin-top: 12px;
    }

    /* LOGIN SCREEN */
    .login-box {
      width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 20px; padding: 24px; text-align: center;
    }

    @media (max-width: 768px) {
      .app-viewport { flex-direction: column; }
      .ticket-deck { width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid var(--panel-border); }
      .main-workspace { height: 55vh; }
    }
  </style>
</head>

<body>

  <div class="app-viewport">
    
    <!-- LEFT PANEL: TICKET & QUICK PAY -->
    <section class="ticket-deck">
      <div class="ticket-header">
        <button class="table-selector-btn" id="tableSelectBtn">
          <span>📍 Τραπέζι: <strong id="currentTableLabel">T1</strong></span>
        </button>
        <button id="btnClear" style="background:none; border:none; color:var(--danger); font-weight:700; cursor:pointer;">Καθαρισμός</button>
      </div>

      <div class="ticket-body" id="ticketItems"></div>

      <div class="ticket-footer">
        <div class="total-row">
          <span style="color:var(--text-muted); font-weight:700;">Σύνολο:</span>
          <span class="total-amount" id="totalAmount">0.00 €</span>
        </div>
        <div class="pay-grid">
          <button class="pay-btn pay-cash" onclick="processPayment('cash')">💵 Μετρητά</button>
          <button class="pay-btn pay-card" onclick="processPayment('card')">💳 Κάρτα</button>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: CATALOG & COMMAND -->
    <section class="main-workspace">
      <header class="top-nav">
        <div>
          <span id="shopTitle" style="font-weight:900; font-size:18px; color:var(--accent);">ProPOS</span>
          <span id="userBadge" style="font-size:12px; color:var(--text-muted); margin-left:8px;">—</span>
        </div>
        
        <input class="search-box" id="searchInp" placeholder="🔍 Αναζήτηση..." oninput="onSearch(this.value)" />

        <div style="display:flex; gap:8px; align-items:center;">
          <button onclick="openSummaryModal()" style="background:var(--surface); border:1px solid var(--panel-border); color:#fff; padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">📊 Σύνοψη</button>
          <button onclick="openSettingsModal()" style="background:var(--surface); border:1px solid var(--panel-border); color:#fff; padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">⚙️</button>
          <button onclick="logout()" style="background:rgba(239, 68, 68, 0.2); border:1px solid var(--danger); color:var(--danger); padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">🚪 Exit</button>
        </div>
      </header>

      <nav class="cat-bar" id="catBar"></nav>

      <main class="grid-container" id="productGrid"></main>
    </section>

  </div>

  <!-- LOGIN MODAL -->
  <div class="overlay" id="loginOverlay" style="display:flex;">
    <div class="login-box">
      <h2 style="margin-top:0; color:var(--accent);">ProPOS Login</h2>
      <p style="color:var(--text-muted); font-size:13px;">Επιλέξτε χρήστη και εισάγετε PIN</p>
      
      <select class="input-field" id="loginUserSelect"></select>
      <input type="password" class="input-field" id="loginPin" placeholder="PIN (default: 1111)" style="text-align:center; font-size:18px; letter-spacing:4px;" />
      
      <button class="btn-action" style="width:100%; margin-top:15px;" onclick="submitLogin()">Σύνδεση</button>

      <div style="margin:20px 0; border-bottom:1px solid var(--panel-border); line-height:0.1em;"><span style="background:var(--panel); padding:0 10px; color:var(--text-dim); font-size:12px;">Ή</span></div>

      <!-- Google Sign-In Button Container -->
      <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
         data-callback="handleGoogleSignIn">
      </div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-width="100%"></div>
    </div>
  </div>

  <!-- MODAL TABLE SELECTOR -->
  <div class="overlay" id="tableOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Επιλογή Τραπεζιού</h3>
        <button onclick="closeModal('tableOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div class="tables-grid" id="tablesGrid"></div>
    </div>
  </div>

  <!-- SUMMARY MODAL -->
  <div class="overlay" id="summaryOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>📊 Σύνοψη Βάρδιας</h3>
        <button onclick="closeModal('summaryOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="summaryContent" style="margin-bottom:15px;"></div>
      <button class="btn-action" style="background:var(--danger); width:100%;" onclick="closeShift()">🔒 Κλείσιμο Βάρδιας</button>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>⚙️ Ρυθμίσεις Καταστήματος</h3>
        <button onclick="closeModal('settingsOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <label style="font-size:12px; color:var(--text-muted);">Όνομα Καταστήματος</label>
      <input class="input-field" id="cfgShopName" />
      <button class="btn-action" style="width:100%;" onclick="saveSettings()">Αποθήκευση</button>
    </div>
  </div>

  <script>
    const LS_KEY = "propos_v2_db";

    // DEFAULT DATABASE
    const defaultDB = {
      shopName: "Το Μαγαζί μου",
      users: [
        { id: 'u1', name: 'Υπάλληλος 1', pin: '1111' },
        { id: 'u2', name: 'Owner', pin: '9999' }
      ],
      tables: ['T1', 'T2', 'T3', 'T4', 'T5', 'BAR'],
      categories: [
        { id: 'coffee', name: '☕ Καφέδες' },
        { id: 'drinks', name: '🥤 Αναψυκτικά' },
        { id: 'snack',  name: '🥐 Σνακ' }
      ],
      products: [
        { id: 'p1', cat: 'coffee', name: 'Espresso', price: 2.00 },
        { id: 'p2', cat: 'coffee', name: 'Cappuccino', price: 3.00 },
        { id: 'p3', cat: 'coffee', name: 'Freddo Espresso', price: 3.20 },
        { id: 'p4', cat: 'drinks', name: 'Νερό 0.5L', price: 0.50 },
        { id: 'p5', cat: 'drinks', name: 'Coca Cola', price: 2.50 },
        { id: 'p6', cat: 'snack',  name: 'Τυρόπιτα', price: 2.20 }
      ],
      payments: []
    };

    let db = JSON.parse(localStorage.getItem(LS_KEY)) || defaultDB;
    function saveDB() { localStorage.setItem(LS_KEY, JSON.stringify(db)); }

    // STATE
    let currentUser = null;
    let activeTable = 'T1';
    let activeCategory = 'coffee';
    let searchQuery = '';
    let orders = {};

    function init() {
      db.tables.forEach(t => { if(!orders[t]) orders[t] = []; });
      document.getElementById('shopTitle').innerText = db.shopName;
      populateUserSelect();
      renderCategories();
      renderProducts();
      renderTicket();
    }

    // LOGIN / AUTH
    function populateUserSelect() {
      const sel = document.getElementById('loginUserSelect');
      sel.innerHTML = db.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    }

    function submitLogin() {
      const uid = document.getElementById('loginUserSelect').value;
      const pin = document.getElementById('loginPin').value;
      const u = db.users.find(x => x.id === uid);

      if (u && u.pin === pin) {
        currentUser = u;
        document.getElementById('userBadge').innerText = `• ${u.name}`;
        closeModal('loginOverlay');
      } else {
        alert('Λάθος PIN!');
      }
    }

    function handleGoogleSignIn(response) {
      // Google ID Token response handling
      const responsePayload = parseJwt(response.credential);
      currentUser = { id: responsePayload.sub, name: responsePayload.name, email: responsePayload.email };
      document.getElementById('userBadge').innerText = `• ${currentUser.name}`;
      closeModal('loginOverlay');
    }

    function parseJwt (token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginOverlay').style.display = 'flex';
    }

    // TICKET & PRODUCTS
    function renderCategories() {
      const catBar = document.getElementById('catBar');
      catBar.innerHTML = db.categories.map(c => `
        <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" onclick="setCategory('${c.id}')">
          ${c.name}
        </button>
      `).join('');
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      let filtered = db.products;

      if(searchQuery) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
      } else {
        filtered = filtered.filter(p => p.cat === activeCategory);
      }

      grid.innerHTML = filtered.map(p => `
        <div class="prod-card" onclick="addToTicket('${p.id}')">
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">${p.price.toFixed(2)} €</div>
        </div>
      `).join('');
    }

    function renderTicket() {
      document.getElementById('currentTableLabel').innerText = activeTable;
      const ticketBody = document.getElementById('ticketItems');
      const currentOrder = orders[activeTable] || [];

      if (currentOrder.length === 0) {
        ticketBody.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px;">Το τραπέζι είναι άδειο.</div>`;
        document.getElementById('totalAmount').innerText = '0.00 €';
        return;
      }

      ticketBody.innerHTML = currentOrder.map(item => `
        <div class="ticket-item">
          <div>
            <div style="font-weight:700; font-size:14px;">${item.name} ${item.note ? `<small style="color:var(--text-muted);">(${item.note})</small>` : ''}</div>
            <div style="font-size:12px; color:var(--text-muted);">${(item.price * item.qty).toFixed(2)} €</div>
          </div>
          <div class="item-controls">
            <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
            <span style="font-weight:800; font-size:14px;">${item.qty}</span>
            <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      const total = currentOrder.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('totalAmount').innerText = total.toFixed(2) + ' €';
    }

    function addToTicket(productId) {
      const prod = db.products.find(p => p.id === productId);
      const note = prompt(`Σημείωση για ${prod.name} (προαιρετικό):`, "");
      const currentOrder = orders[activeTable];
      
      currentOrder.push({ ...prod, qty: 1, note: note || "" });
      renderTicket();
    }

    function updateQty(productId, delta) {
      const currentOrder = orders[activeTable];
      const idx = currentOrder.findIndex(i => i.id === productId);
      if (idx === -1) return;

      currentOrder[idx].qty += delta;
      if (currentOrder[idx].qty <= 0) {
        currentOrder.splice(idx, 1);
      }
      renderTicket();
    }

    function processPayment(method) {
      const currentOrder = orders[activeTable];
      if (!currentOrder || currentOrder.length === 0) return;

      const total = currentOrder.reduce((sum, i) => sum + (i.price * i.qty), 0);
      db.payments.push({
        id: Date.now(),
        table: activeTable,
        total,
        method,
        user: currentUser?.name || 'Unknown',
        timestamp: new Date().toISOString()
      });
      saveDB();

      alert(`Πληρωμή ${total.toFixed(2)} € (${method === 'cash' ? 'Μετρητά' : 'Κάρτα'}) Ολοκληρώθηκε!`);
      orders[activeTable] = [];
      renderTicket();
    }

    // SEARCH & NAVIGATION
    function onSearch(val) { searchQuery = val; renderProducts(); }
    function setCategory(id) { activeCategory = id; searchQuery = ''; document.getElementById('searchInp').value = ''; renderCategories(); renderProducts(); }

    // MODAL CONTROLS
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    document.getElementById('tableSelectBtn').onclick = () => {
      const grid = document.getElementById('tablesGrid');
      grid.innerHTML = db.tables.map(t => {
        const hasOrder = orders[t] && orders[t].length > 0;
        return `
          <button class="t-btn ${t === activeTable ? 'active-table' : ''}" onclick="selectTable('${t}')">
            ${t}
            ${hasOrder ? `<span style="font-size:10px; color:var(--success);">• Ενεργό</span>` : ''}
          </button>
        `;
      }).join('');
      document.getElementById('tableOverlay').style.display = 'flex';
    };

    function selectTable(t) { activeTable = t; renderTicket(); closeModal('tableOverlay'); }

    function openSummaryModal() {
      const totalCash = db.payments.filter(p => p.method === 'cash').reduce((s, p) => s + p.total, 0);
      const totalCard = db.payments.filter(p => p.method === 'card').reduce((s, p) => s + p.total, 0);

      document.getElementById('summaryContent').innerHTML = `
        <div style="background:var(--surface); padding:12px; border-radius:var(--radius); margin-bottom:10px;">
          <div>💵 Μετρητά: <strong>${totalCash.toFixed(2)} €</strong></div>
          <div>💳 Κάρτα: <strong>${totalCard.toFixed(2)} €</strong></div>
          <hr style="border:0; border-top:1px solid var(--panel-border); margin:8px 0;" />
          <div style="font-size:16px; font-weight:800; color:var(--success);">Σύνολο: ${(totalCash + totalCard).toFixed(2)} €</div>
        </div>
      `;
      document.getElementById('summaryOverlay').style.display = 'flex';
    }

    function closeShift() {
      if(confirm("Είστε σίγουροι για το κλείσιμο βάρδιας; Τα στατιστικά θα μηδενιστούν.")) {
        db.payments = [];
        saveDB();
        closeModal('summaryOverlay');
        alert("Η βάρδια έκλεισε επιτυχώς.");
      }
    }

    function openSettingsModal() {
      document.getElementById('cfgShopName').value = db.shopName;
      document.getElementById('settingsOverlay').style.display = 'flex';
    }

    function saveSettings() {
      db.shopName = document.getElementById('cfgShopName').value;
      saveDB();
      document.getElementById('shopTitle').innerText = db.shopName;
      closeModal('settingsOverlay');
    }

    document.getElementById('btnClear').onclick = () => { orders[activeTable] = []; renderTicket(); };

    // START
    init();
  </script>
</body>
</html>
