<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>ProPOS • Enterprise Command Center</title>

  <style>
    :root {
      --bg: #0b0f17;
      --panel: #161b26;
      --panel-border: #232d3f;
      --surface: #1e2536;
      --surface-hover: #2a344b;
      
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;

      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --radius: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* LAYOUT OUTLINE */
    .app-viewport { display: flex; height: 100dvh; width: 100vw; overflow: hidden; }

    /* LEFT SIDEBAR: LIVE TICKET */
    .ticket-deck {
      width: 400px;
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .ticket-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-selector-btn {
      background: var(--surface);
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: var(--radius);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticket-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket-item {
      background: var(--surface);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ticket-item.is-treat {
      border-color: var(--purple);
      background: rgba(139, 92, 246, 0.1);
    }

    .item-controls { display: flex; align-items: center; gap: 6px; }
    .btn-qty {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .ticket-footer {
      padding: 16px;
      border-top: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.25);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .total-amount { font-size: 28px; font-weight: 900; color: var(--success); }

    .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .pay-btn {
      height: 44px;
      border: none;
      border-radius: var(--radius);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .pay-btn:active { transform: scale(0.96); }
    .pay-cash { background: var(--success); color: #000; box-shadow: 0 0 10px var(--success-glow); }
    .pay-card { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }

    /* RIGHT SIDEBAR: GRID WORKSPACE */
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .top-nav {
      height: 60px;
      padding: 0 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
    }

    .search-box {
      width: 200px;
      height: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--panel-border);
      background: var(--surface);
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 13px;
    }

    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: rgba(0,0,0,0.1);
    }
    .cat-btn {
      padding: 10px 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-auto-rows: 100px;
      gap: 12px;
    }

    .prod-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    .prod-card:active { background: var(--surface-hover); border-color: var(--accent); }
    .prod-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .prod-price { font-size: 13px; font-weight: 800; color: var(--text-muted); }

    /* MODAL OVERLAYS */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal {
      width: 90%; max-width: 600px; background: var(--panel);
      border: 1px solid var(--panel-border); border-radius: 16px; padding: 20px;
      max-height: 88vh; overflow-y: auto;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-head h3 { margin: 0; font-size: 18px; }

    .tables-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
    .t-btn {
      height: 70px; background: var(--surface); border: 1px solid var(--panel-border);
      border-radius: var(--radius); color: #fff; font-size: 16px; font-weight: 800;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .t-btn.active-table { border-color: var(--accent); background: rgba(59, 130, 246, 0.15); }
    .t-btn.has-order { border-color: var(--warning); }
    .t-btn.is-unpaid { border-color: var(--danger); background: rgba(239, 68, 68, 0.15); }

    .input-field {
      width: 100%; height: 42px; background: var(--surface); border: 1px solid var(--panel-border);
      border-radius: var(--radius); color: #fff; padding: 0 12px; margin-top: 8px; outline: none;
    }

    .btn-action {
      height: 42px; padding: 0 16px; border-radius: var(--radius); border: none;
      font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; margin-top: 12px;
    }

    .stat-card {
      background: var(--surface); border: 1px solid var(--panel-border);
      padding: 14px; border-radius: var(--radius); margin-bottom: 10px;
    }

    /* LOGIN SCREEN */
    .login-box {
      width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 20px; padding: 24px; text-align: center;
    }

    @media (max-width: 768px) {
      .app-viewport { flex-direction: column; }
      .ticket-deck { width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid var(--panel-border); }
      .main-workspace { height: 55vh; }
    }
  </style>
</head>

<body>

  <div class="app-viewport">
    
    <!-- LEFT PANEL: TICKET & QUICK PAY -->
    <section class="ticket-deck">
      <div class="ticket-header">
        <button class="table-selector-btn" id="tableSelectBtn">
          <span>📍 Τραπέζι: <strong id="currentTableLabel">T1</strong></span>
        </button>
        <div style="display:flex; gap:6px;">
          <button onclick="markTableUnpaid()" style="background:rgba(239,68,68,0.2); border:1px solid var(--danger); color:var(--danger); padding:6px 10px; border-radius:var(--radius); font-size:11px; font-weight:700; cursor:pointer;">⚠️ Απλήρωτο</button>
          <button id="btnClear" style="background:none; border:none; color:var(--text-muted); font-weight:700; cursor:pointer; font-size:12px;">Ακύρωση</button>
        </div>
      </div>

      <div class="ticket-body" id="ticketItems"></div>

      <div class="ticket-footer">
        <div class="total-row">
          <span style="color:var(--text-muted); font-weight:700;">Σύνολο:</span>
          <span class="total-amount" id="totalAmount">0.00 €</span>
        </div>
        <div class="pay-grid">
          <button class="pay-btn pay-cash" onclick="openPayModal('cash')">💵 Μετρητά</button>
          <button class="pay-btn pay-card" onclick="openPayModal('card')">💳 Κάρτα</button>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: CATALOG & COMMAND -->
    <section class="main-workspace">
      <header class="top-nav">
        <div>
          <span id="shopTitle" style="font-weight:900; font-size:18px; color:var(--accent);">ProPOS</span>
          <span id="userBadge" style="font-size:12px; color:var(--text-muted); margin-left:8px;">—</span>
        </div>
        
        <input class="search-box" id="searchInp" placeholder="🔍 Αναζήτηση..." oninput="onSearch(this.value)" />

        <div style="display:flex; gap:8px; align-items:center;">
          <button id="btnReports" onclick="openReportsModal()" style="background:var(--surface); border:1px solid var(--panel-border); color:#fff; padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">📊 Αναφορές</button>
          <button id="btnExpenses" onclick="openExpensesModal()" style="background:var(--surface); border:1px solid var(--panel-border); color:#fff; padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">💸 Έξοδα</button>
          <button id="btnSettings" onclick="openSettingsModal()" style="background:var(--surface); border:1px solid var(--panel-border); color:#fff; padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">⚙️</button>
          <button onclick="logout()" style="background:rgba(239, 68, 68, 0.2); border:1px solid var(--danger); color:var(--danger); padding:8px 12px; border-radius:var(--radius); font-size:12px; font-weight:700; cursor:pointer;">🚪 Exit</button>
        </div>
      </header>

      <nav class="cat-bar" id="catBar"></nav>

      <main class="grid-container" id="productGrid"></main>
    </section>

  </div>

  <!-- LOGIN MODAL -->
  <div class="overlay" id="loginOverlay" style="display:flex;">
    <div class="login-box">
      <h2 style="margin-top:0; color:var(--accent);">ProPOS Enterprise</h2>
      <p style="color:var(--text-muted); font-size:13px;">Επιλέξτε χρήστη και εισάγετε PIN</p>
      
      <select class="input-field" id="loginUserSelect"></select>
      <input type="password" class="input-field" id="loginPin" placeholder="PIN" style="text-align:center; font-size:18px; letter-spacing:4px;" />
      
      <button class="btn-action" style="width:100%; margin-top:15px;" onclick="submitLogin()">Σύνδεση</button>
    </div>
  </div>

  <!-- MODAL PAYMENT & TIPS -->
  <div class="overlay" id="payOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>💳 Ολοκλήρωση Πληρωμής</h3>
        <button onclick="closeModal('payOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div class="stat-card">
        <div style="font-size:13px; color:var(--text-muted);">Καθαρή Αξία: <strong id="payModalNet">0.00 €</strong></div>
        <div style="font-size:13px; color:var(--purple);">Αξία Κερασμένων: <strong id="payModalTreats">0.00 €</strong></div>
      </div>
      <label style="font-size:12px; color:var(--text-muted);">🪙 Φιλοδώρημα / Tip (€):</label>
      <input type="number" step="0.50" class="input-field" id="payTipInput" value="0.00" />
      <button class="btn-action" style="width:100%; background:var(--success); color:#000; font-size:16px; margin-top:15px;" onclick="confirmPayment()">Επιβεβαίωση & Είσπραξη</button>
    </div>
  </div>

  <!-- MODAL TABLE SELECTOR -->
  <div class="overlay" id="tableOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Επιλογή Τραπεζιού / Σάλας</h3>
        <button onclick="closeModal('tableOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div class="tables-grid" id="tablesGrid"></div>
    </div>
  </div>

  <!-- EXPENSES MODAL -->
  <div class="overlay" id="expensesOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>💸 Καταχώρηση Εξόδου</h3>
        <button onclick="closeModal('expensesOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <label style="font-size:12px; color:var(--text-muted);">Περιγραφή Εξόδου:</label>
      <input class="input-field" id="expDesc" placeholder="π.χ. Προμηθευτής Αναψυκτικών" />
      <label style="font-size:12px; color:var(--text-muted); margin-top:8px; display:block;">Ποσό (€):</label>
      <input type="number" class="input-field" id="expAmount" placeholder="0.00" />
      <button class="btn-action" style="width:100%; margin-top:15px;" onclick="addExpense()">Αποθήκευση Εξόδου</button>
    </div>
  </div>

  <!-- REPORTS MODAL (OWNER) -->
  <div class="overlay" id="reportsOverlay">
    <div class="modal" style="max-width:700px;">
      <div class="modal-head">
        <h3>📊 Αναλυτικά Στατιστικά & Τζίρος</h3>
        <button onclick="closeModal('reportsOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <div id="reportsContent"></div>
    </div>
  </div>

  <!-- SETTINGS MODAL (OWNER) -->
  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>⚙️ Διαχείριση & Ρυθμίσεις</h3>
        <button onclick="closeModal('settingsOverlay')" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
      </div>
      <label style="font-size:12px; color:var(--text-muted);">Όνομα Καταστήματος</label>
      <input class="input-field" id="cfgShopName" />
      
      <h4 style="margin-top:20px; margin-bottom:5px;">Προσθήκη Νέου Προϊόντος</h4>
      <input class="input-field" id="newProdName" placeholder="Όνομα Προϊόντος" />
      <input type="number" step="0.10" class="input-field" id="newProdPrice" placeholder="Τιμή (€)" />
      <select class="input-field" id="newProdCat"></select>
      <button class="btn-action" style="width:100%;" onclick="saveNewProduct()">Προσθήκη Προϊόντος</button>

      <button class="btn-action" style="width:100%; background:var(--success); color:#000; margin-top:15px;" onclick="saveSettings()">Αποθήκευση Ρυθμίσεων</button>
    </div>
  </div>

  <script>
    const LS_KEY = "propos_enterprise_v3";

    // DEFAULT DATABASE
    const defaultDB = {
      shopName: "Το Μαγαζί μου",
      users: [
        { id: 'u1', name: 'Γιώργος (Owner)', pin: '9999', role: 'owner' },
        { id: 'u2', name: 'Μαρία (Staff)', pin: '1111', role: 'staff' },
        { id: 'u3', name: 'Νίκος (Staff)', pin: '2222', role: 'staff' }
      ],
      tables: ['T1', 'T2', 'T3', 'T4', 'T5', 'BAR 1', 'BAR 2', 'TERRACE 1', 'TERRACE 2'],
      categories: [
        { id: 'coffee', name: '☕ Καφέδες' },
        { id: 'drinks', name: '🥤 Αναψυκτικά' },
        { id: 'snack',  name: '🥐 Σνακ' },
        { id: 'alcohol', name: '🍺 Ποτά / Μπίρες' }
      ],
      products: [
        { id: 'p1', cat: 'coffee', name: 'Espresso', price: 2.00, cost: 0.40 },
        { id: 'p2', cat: 'coffee', name: 'Cappuccino', price: 3.00, cost: 0.60 },
        { id: 'p3', cat: 'coffee', name: 'Freddo Espresso', price: 3.20, cost: 0.50 },
        { id: 'p4', cat: 'drinks', name: 'Νερό 0.5L', price: 0.50, cost: 0.15 },
        { id: 'p5', cat: 'drinks', name: 'Coca Cola', price: 2.50, cost: 0.80 },
        { id: 'p6', cat: 'snack',  name: 'Τυρόπιτα', price: 2.20, cost: 0.70 },
        { id: 'p7', cat: 'alcohol', name: 'Μπίρα 500ml', price: 4.00, cost: 1.50 }
      ],
      payments: [],
      expenses: [],
      unpaidAccounts: []
    };

    let db = JSON.parse(localStorage.getItem(LS_KEY)) || defaultDB;
    function saveDB() { localStorage.setItem(LS_KEY, JSON.stringify(db)); }

    // STATE
    let currentUser = null;
    let activeTable = 'T1';
    let activeCategory = 'coffee';
    let searchQuery = '';
    let pendingPayMethod = null;
    let orders = {};

    function init() {
      db.tables.forEach(t => { if(!orders[t]) orders[t] = []; });
      document.getElementById('shopTitle').innerText = db.shopName;
      populateUserSelect();
      renderCategories();
      renderProducts();
      renderTicket();
    }

    // AUTH & ROLE MANAGEMENT
    function populateUserSelect() {
      const sel = document.getElementById('loginUserSelect');
      sel.innerHTML = db.users.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
    }

    function submitLogin() {
      const uid = document.getElementById('loginUserSelect').value;
      const pin = document.getElementById('loginPin').value;
      const u = db.users.find(x => x.id === uid);

      if (u && u.pin === pin) {
        currentUser = u;
        document.getElementById('userBadge').innerText = `• ${u.name}`;
        applyRolePermissions();
        closeModal('loginOverlay');
      } else {
        alert('Λάθος PIN!');
      }
    }

    function applyRolePermissions() {
      const isOwner = currentUser?.role === 'owner';
      document.getElementById('btnReports').style.display = isOwner ? 'inline-block' : 'none';
      document.getElementById('btnExpenses').style.display = isOwner ? 'inline-block' : 'none';
      document.getElementById('btnSettings').style.display = isOwner ? 'inline-block' : 'none';
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('loginPin').value = '';
    }

    // TICKET & PRODUCTS
    function renderCategories() {
      const catBar = document.getElementById('catBar');
      catBar.innerHTML = db.categories.map(c => `
        <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" onclick="setCategory('${c.id}')">
          ${c.name}
        </button>
      `).join('');
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      let filtered = db.products;

      if(searchQuery) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
      } else {
        filtered = filtered.filter(p => p.cat === activeCategory);
      }

      grid.innerHTML = filtered.map(p => `
        <div class="prod-card" onclick="addToTicket('${p.id}')">
          <div class="prod-name">${p.name}</div>
          <div class="prod-price">${p.price.toFixed(2)} €</div>
        </div>
      `).join('');
    }

    function renderTicket() {
      document.getElementById('currentTableLabel').innerText = activeTable;
      const ticketBody = document.getElementById('ticketItems');
      const currentOrder = orders[activeTable] || [];

      if (currentOrder.length === 0) {
        ticketBody.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px;">Το τραπέζι είναι άδειο.</div>`;
        document.getElementById('totalAmount').innerText = '0.00 €';
        return;
      }

      ticketBody.innerHTML = currentOrder.map((item, idx) => `
        <div class="ticket-item ${item.isTreat ? 'is-treat' : ''}">
          <div>
            <div style="font-weight:700; font-size:14px;">
              ${item.name} ${item.isTreat ? '<span style="color:var(--purple); font-size:11px;">(Κέρασμα)</span>' : ''}
            </div>
            <div style="font-size:12px; color:var(--text-muted);">
              ${item.isTreat ? '0.00 €' : (item.price * item.qty).toFixed(2) + ' €'}
            </div>
          </div>
          <div class="item-controls">
            <button class="btn-qty" style="background:var(--purple); border:none; color:#fff;" onclick="toggleTreat(${idx})">🎁</button>
            <button class="btn-qty" onclick="updateQty(${idx}, -1)">-</button>
            <span style="font-weight:800; font-size:14px;">${item.qty}</span>
            <button class="btn-qty" onclick="updateQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join('');

      const total = currentOrder.reduce((sum, i) => sum + (i.isTreat ? 0 : (i.price * i.qty)), 0);
      document.getElementById('totalAmount').innerText = total.toFixed(2) + ' €';
    }

    function addToTicket(productId) {
      const prod = db.products.find(p => p.id === productId);
      const currentOrder = orders[activeTable];
      
      currentOrder.push({ ...prod, qty: 1, isTreat: false });
      renderTicket();
    }

    function updateQty(index, delta) {
      const currentOrder = orders[activeTable];
      currentOrder[index].qty += delta;
      if (currentOrder[index].qty <= 0) {
        currentOrder.splice(index, 1);
      }
      renderTicket();
    }

    function toggleTreat(index) {
      const currentOrder = orders[activeTable];
      currentOrder[index].isTreat = !currentOrder[index].isTreat;
      renderTicket();
    }

    // PAYMENT & TIPS
    function openPayModal(method) {
      const currentOrder = orders[activeTable];
      if (!currentOrder || currentOrder.length === 0) return;

      pendingPayMethod = method;
      const netTotal = currentOrder.reduce((s, i) => s + (i.isTreat ? 0 : i.price * i.qty), 0);
      const treatsTotal = currentOrder.reduce((s, i) => s + (i.isTreat ? i.price * i.qty : 0), 0);

      document.getElementById('payModalNet').innerText = netTotal.toFixed(2) + ' €';
      document.getElementById('payModalTreats').innerText = treatsTotal.toFixed(2) + ' €';
      document.getElementById('payTipInput').value = '0.00';

      document.getElementById('payOverlay').style.display = 'flex';
    }

    function confirmPayment() {
      const currentOrder = orders[activeTable];
      const netTotal = currentOrder.reduce((s, i) => s + (i.isTreat ? 0 : i.price * i.qty), 0);
      const treatsTotal = currentOrder.reduce((s, i) => s + (i.isTreat ? i.price * i.qty : 0), 0);
      const tip = parseFloat(document.getElementById('payTipInput').value) || 0;

      db.payments.push({
        id: Date.now(),
        table: activeTable,
        total: netTotal,
        treatsTotal,
        tip,
        method: pendingPayMethod,
        waiter: currentUser?.name || 'Unknown',
        timestamp: new Date().toISOString()
      });
      saveDB();

      alert(`Είσπραξη ${netTotal.toFixed(2)} € (+ ${tip.toFixed(2)} € Tip) Ολοκληρώθηκε!`);
      orders[activeTable] = [];
      closeModal('payOverlay');
      renderTicket();
    }

    function markTableUnpaid() {
      const currentOrder = orders[activeTable];
      if (!currentOrder || currentOrder.length === 0) return;

      const total = currentOrder.reduce((s, i) => s + (i.isTreat ? 0 : i.price * i.qty), 0);
      db.unpaidAccounts.push({
        id: Date.now(),
        table: activeTable,
        total,
        waiter: currentUser?.name,
        timestamp: new Date().toISOString()
      });
      saveDB();

      alert(`Το τραπέζι ${activeTable} καταχωρήθηκε στα ΑΠΛΗΡΩΤΑ (${total.toFixed(2)} €).`);
      orders[activeTable] = [];
      renderTicket();
    }

    // SEARCH & NAVIGATION
    function onSearch(val) { searchQuery = val; renderProducts(); }
    function setCategory(id) { activeCategory = id; searchQuery = ''; document.getElementById('searchInp').value = ''; renderCategories(); renderProducts(); }

    // MODAL CONTROLS
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    document.getElementById('tableSelectBtn').onclick = () => {
      const grid = document.getElementById('tablesGrid');
      grid.innerHTML = db.tables.map(t => {
        const hasOrder = orders[t] && orders[t].length > 0;
        const isUnpaid = db.unpaidAccounts.some(u => u.table === t);
        return `
          <button class="t-btn ${t === activeTable ? 'active-table' : ''} ${hasOrder ? 'has-order' : ''} ${isUnpaid ? 'is-unpaid' : ''}" onclick="selectTable('${t}')">
            ${t}
            ${hasOrder ? `<span style="font-size:10px; color:var(--warning);">• Ενεργό</span>` : ''}
            ${isUnpaid ? `<span style="font-size:10px; color:var(--danger);">• Απλήρωτο</span>` : ''}
          </button>
        `;
      }).join('');
      document.getElementById('tableOverlay').style.display = 'flex';
    };

    function selectTable(t) { activeTable = t; renderTicket(); closeModal('tableOverlay'); }

    // EXPENSES & REPORTS
    function openExpensesModal() { document.getElementById('expensesOverlay').style.display = 'flex'; }
    function addExpense() {
      const desc = document.getElementById('expDesc').value;
      const amount = parseFloat(document.getElementById('expAmount').value);
      if(!desc || !amount) return;

      db.expenses.push({ id: Date.now(), desc, amount, user: currentUser.name, date: new Date().toISOString() });
      saveDB();
      closeModal('expensesOverlay');
      alert('Το έξοδο καταχωρήθηκε!');
    }

    function openReportsModal() {
      const totalCash = db.payments.filter(p => p.method === 'cash').reduce((s, p) => s + p.total, 0);
      const totalCard = db.payments.filter(p => p.method === 'card').reduce((s, p) => s + p.total, 0);
      const totalTips = db.payments.reduce((s, p) => s + p.tip, 0);
      const totalTreats = db.payments.reduce((s, p) => s + p.treatsTotal, 0);
      const totalExpenses = db.expenses.reduce((s, e) => s + e.amount, 0);
      const totalUnpaid = db.unpaidAccounts.reduce((s, u) => s + u.total, 0);

      const netProfit = (totalCash + totalCard) - totalExpenses;

      document.getElementById('reportsContent').innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
          <div class="stat-card">
            <div style="font-size:12px; color:var(--text-muted);">Ακαθάριστος Τζίρος</div>
            <div style="font-size:22px; font-weight:900; color:var(--success);">${(totalCash + totalCard).toFixed(2)} €</div>
            <div style="font-size:11px; color:var(--text-dim);">💵 Μετρητά: ${totalCash.toFixed(2)}€ | 💳 Κάρτες: ${totalCard.toFixed(2)}€</div>
          </div>
          <div class="stat-card">
            <div style="font-size:12px; color:var(--text-muted);">Καθαρό Κέρδος</div>
            <div style="font-size:22px; font-weight:900; color:var(--accent);">${netProfit.toFixed(2)} €</div>
            <div style="font-size:11px; color:var(--text-dim);">Αφαιρεθέντα Έξοδα: ${totalExpenses.toFixed(2)}€</div>
          </div>
        </div>

        <div class="stat-card">
          <div style="font-size:13px; font-weight:700;">🪙 Φιλοδωρήματα (Tips): <span style="color:var(--success);">${totalTips.toFixed(2)} €</span></div>
          <div style="font-size:13px; font-weight:700; margin-top:4px;">🎁 Συνολικά Κεράσματα: <span style="color:var(--purple);">${totalTreats.toFixed(2)} €</span></div>
          <div style="font-size:13px; font-weight:700; margin-top:4px; color:var(--danger);">⚠️ Εκκρεμή Απλήρωτα: ${totalUnpaid.toFixed(2)} €</div>
        </div>
      `;
      document.getElementById('reportsOverlay').style.display = 'flex';
    }

    // SETTINGS
    function openSettingsModal() {
      document.getElementById('cfgShopName').value = db.shopName;
      const catSel = document.getElementById('newProdCat');
      catSel.innerHTML = db.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('settingsOverlay').style.display = 'flex';
    }

    function saveNewProduct() {
      const name = document.getElementById('newProdName').value;
      const price = parseFloat(document.getElementById('newProdPrice').value);
      const cat = document.getElementById('newProdCat').value;

      if(!name || !price) return;

      db.products.push({ id: 'p_' + Date.now(), cat, name, price, cost: price * 0.3 });
      saveDB();
      renderProducts();
      alert('Το προϊόν προστέθηκε!');
    }

    function saveSettings() {
      db.shopName = document.getElementById('cfgShopName').value;
      saveDB();
      document.getElementById('shopTitle').innerText = db.shopName;
      closeModal('settingsOverlay');
    }

    document.getElementById('btnClear').onclick = () => { orders[activeTable] = []; renderTicket(); };

    // START
    init();
  </script>
</body>
</html>
